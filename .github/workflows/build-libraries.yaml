on:
  workflow_dispatch:

name: Build Libraries

permissions:
  contents: write
  pull-requests: write

jobs:
  build-libraries:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # App token so the commit and PR are authored by the App identity, which
      # lets the opened PR trigger the pull-request.yaml checks (a PR opened with
      # the default GITHUB_TOKEN would not).
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.VERSION_BUMPER_APPID }}
          private-key: ${{ secrets.VERSION_BUMPER_SECRET }}

      - name: checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Configure NuGet
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/Open-Systems-Pharmacology/index.json" \
            --name "OSP-GitHub-Packages" \
            --username "Open-Systems-Pharmacology" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

      - name: Build libraries
        run: |
          cd inst/lib
          dotnet build ../../shared/DependencyManager/DependencyManager.sln --configuration Release

      - name: Commit changes to a new branch
        id: commit
        uses: EndBug/add-and-commit@v10
        with:
          message: 'Update Libraries'
          default_author: github_actions
          add: 'inst/lib'
          new_branch: build-libraries-${{ github.run_id }}
          github_token: ${{ steps.app-token.outputs.token }}

      - name: Create Pull Request
        if: steps.commit.outputs.pushed == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const body = [
              'Auto-generated PR to update the .NET libraries in `inst/lib`.',
              '',
              'Built from `shared/DependencyManager` by the **Build Libraries** workflow.',
              '- Triggered by: ${{ github.actor }}',
              '- Target branch: `${{ github.ref_name }}`',
            ].join('\n');
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Update Libraries',
              head: 'build-libraries-${{ github.run_id }}',
              base: '${{ github.ref_name }}',
              body,
            });
            console.log(`Created PR #${pr.number}: ${pr.html_url}`);
